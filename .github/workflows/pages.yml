name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "wrangler.toml"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Prepare static website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _site functions
          mkdir -p _site/downloads
          cp -R website/. _site/
          mv _site/functions functions

          latest_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          production_tag="$(curl -fsSL https://weclaw-send.pages.dev/downloads/release.json \
            | jq -r '.tag_name // empty' || true)"

          if [[ "$production_tag" == "$latest_tag" ]]; then
            for file in \
              WeClaw-Send.dmg \
              WeClaw-Send.zip \
              WeClaw-Send-Premiere-CEP12.zip \
              WeClaw-Send-DaVinci-Resolve.zip \
              WeClaw-Send-Components.json \
              SHA256SUMS.txt
            do
              curl -fsSL "https://weclaw-send.pages.dev/downloads/$file" \
                -o "_site/downloads/$file"
            done
          else
            gh release download "$latest_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'WeClaw-Send.dmg' \
              --pattern 'WeClaw-Send.zip' \
              --pattern 'WeClaw-Send-Premiere-CEP12.zip' \
              --pattern 'WeClaw-Send-DaVinci-Resolve.zip' \
              --pattern 'WeClaw-Send-Components.json' \
              --pattern 'SHA256SUMS.txt' \
              --dir _site/downloads
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$latest_tag" > _site/downloads/release.json
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq '[
                .[]
                | select(.draft == false)
                | .tag_name as $tag
                | if ($tag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+$")) then
                    ($tag | capture("^v(?<version>[0-9]+\\.[0-9]+\\.[0-9]+)-beta\\.(?<build>[0-9]+)$")) as $match
                    | {version: $match.version, build: $match.build, channel: "beta"}
                  elif ($tag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) then
                    {version: ($tag | ltrimstr("v")), build: null, channel: "stable"}
                  else empty end
              ]' > _site/downloads/update-versions.json
          for file in \
            WeClaw-Send.dmg \
            WeClaw-Send.zip \
            WeClaw-Send-Premiere-CEP12.zip \
            WeClaw-Send-DaVinci-Resolve.zip \
            WeClaw-Send-Components.json \
            SHA256SUMS.txt \
            release.json \
            update-versions.json
          do
            test -s "_site/downloads/$file"
          done

          (
            cd _site/downloads
            for file in \
              WeClaw-Send.dmg \
              WeClaw-Send.zip \
              WeClaw-Send-Premiere-CEP12.zip \
              WeClaw-Send-DaVinci-Resolve.zip \
              WeClaw-Send-Components.json
            do
              expected="$(awk -v file="$file" '$2 == file { print $1; exit }' SHA256SUMS.txt)"
              [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
              actual="$(sha256sum "$file" | cut -d ' ' -f 1)"
              [[ "$actual" == "$expected" ]]
            done
          )

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Use pages_build_output_dir from wrangler.toml so Pages Functions
          # and Analytics Engine bindings are applied. Directory is prepared as _site/.
          command: pages deploy --project-name=weclaw-send --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Pages Functions
        run: |
          healthy=false
          for _ in {1..10}; do
            if curl -fsS https://weclaw-send.pages.dev/api/health \
              | jq -e '.ok and .bindings.downloads and .bindings.updateChecks' >/dev/null
            then
              healthy=true
              break
            fi
            sleep 2
          done
          [[ "$healthy" == "true" ]]
